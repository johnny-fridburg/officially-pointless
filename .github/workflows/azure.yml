name: Deploy Officially Pointless
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: officially-pointless-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify API, checkout UI and public artifact guard
        run: node --test
      - name: Validate public site artifact
        run: node scripts/verify-public-artifact.js site
      - name: Validate public repository commit
        run: node scripts/verify-public-repository.js --head
      - name: Deploy to sponsored Azure subscription
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: api
          output_location: ''
          skip_app_build: true
          production_branch: main
