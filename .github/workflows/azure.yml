name: Deploy Officially Pointless
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: officially-pointless-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify API and public artifact guard
        run: node --test api/commerce.test.js scripts/verify-public-artifact.test.js
      - name: Validate public site artifact
        run: node scripts/verify-public-artifact.js site
      - name: Deploy to sponsored Azure subscription
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: api
          output_location: ''
          skip_app_build: true
          production_branch: main
