<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-label="Personalized fictional appointment certificate"><rect x="0" y="0" width="1200" height="850" rx="0" fill="#f6f0e4" stroke="none"/><rect x="24" y="24" width="1152" height="802" rx="0" fill="none" stroke="#17332f"/><rect x="35" y="35" width="1130" height="780" rx="0" fill="none" stroke="#b6a27a"/><circle cx="50" cy="50" r="3" fill="#a44836" stroke="none"/><circle cx="1150" cy="50" r="3" fill="#a44836" stroke="none"/><circle cx="50" cy="800" r="3" fill="#a44836" stroke="none"/><circle cx="1150" cy="800" r="3" fill="#a44836" stroke="none"/><text x="600" y="70" text-anchor="middle" fill="#17332f" font-size="15" font-family="Arial, sans-serif" font-weight="normal" font-style="normal">THE MINISTRY OF UNNECESSARY TITLES</text><rect x="557" y="104" width="72" height="55" rx="3" fill="#f6f0e4" stroke="#17332f"/><rect x="567" y="94" width="72" height="55" rx="3" fill="#f6f0e4" stroke="#17332f"/><rect x="577" y="84" width="72" height="55" rx="3" fill="#f6f0e4" stroke="#17332f"/><path d="M577,99 L649,99" stroke="#17332f" fill="none"/><circle cx="584" cy="92" r="1.7" fill="#a44836" stroke="none"/><circle cx="591" cy="92" r="1.7" fill="#a44836" stroke="none"/><circle cx="598" cy="92" r="1.7" fill="#a44836" stroke="none"/><text x="600" y="190" text-anchor="middle" fill="#6e776c" font-size="13" font-family="Arial, sans-serif" font-weight="normal" font-style="normal">LET IT BE KNOWN</text><text id="recipient" x="600" y="276" text-anchor="middle" fill="#17332f" font-size="58" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal">Alex Morgan</text><text x="600" y="316" text-anchor="middle" fill="#6e776c" font-size="20" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="italic">is hereby appointed</text><text id="title-one" x="600" y="381" text-anchor="middle" fill="#17332f" font-size="46" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal">Minister of</text><text id="title-two" x="600" y="434" text-anchor="middle" fill="#17332f" font-size="46" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal">Unopened Tabs</text><path d="M400,463 L800,463" stroke="#b6a27a" fill="none"/><text id="reason-one" x="600" y="506" text-anchor="middle" fill="#17332f" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal">For keeping every possibility open.</text><text id="reason-two" x="600" y="538" text-anchor="middle" fill="#17332f" font-size="22" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal">Especially the one playing music somewhere.</text><text x="600" y="591" text-anchor="middle" fill="#6e776c" font-size="15" font-family="Arial, sans-serif" font-weight="normal" font-style="normal">No duties. No authority. Absolutely no need to close anything.</text><path d="M140,653 L420,653" stroke="#b6a27a" fill="none"/><text x="140" y="680" text-anchor="start" fill="#6e776c" font-size="11" font-family="Arial, sans-serif" font-weight="normal" font-style="normal">AWARDED WITH AFFECTION BY</text><text id="sender" x="140" y="718" text-anchor="start" fill="#17332f" font-size="30" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="italic">Jamie</text><circle cx="936" cy="681" r="62" fill="#a44836" stroke="none"/><circle cx="936" cy="681" r="53" fill="none" stroke="#f6f0e4"/><circle cx="936" cy="681" r="48" fill="none" stroke="#f6f0e4"/><text x="936" y="669" text-anchor="middle" fill="#f6f0e4" font-size="13" font-family="Arial, sans-serif" font-weight="bold" font-style="normal">ENTIRELY</text><text x="936" y="691" text-anchor="middle" fill="#f6f0e4" font-size="13" font-family="Arial, sans-serif" font-weight="bold" font-style="normal">UNOFFICIAL</text><text x="600" y="779" text-anchor="middle" fill="#17332f" font-size="15" font-family="Georgia, 'Times New Roman', serif" font-weight="normal" font-style="italic">No power. No salary. Excellent stationery.</text><text x="600" y="807" text-anchor="middle" fill="#6e776c" font-size="9" font-family="Arial, sans-serif" font-weight="normal" font-style="normal">A FICTIONAL NOVELTY GIFT  /  CONCEPT SAMPLE  /  NOVEMBER 2026</text></svg>